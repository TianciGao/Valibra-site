<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="677" viewBox="0 0 1700 677"><title>Русский перевод описаний; технические идентификаторы и значения сохранены</title><rect width="100%" height="100%" fill="#111111"/><text x="10" y="16" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">{</tspan></text><text x="10" y="35" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">  </tspan><tspan fill="#90f580">"solar_panel|mechanical_condition|mech_health_snapshot"</tspan><tspan fill="#e9d46c">: {</tspan></text><text x="10" y="54" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="9" textLength="1680" lengthAdjust="spacingAndGlyphs"><tspan fill="#e9d46c">    </tspan><tspan fill="#90f580">"column_meaning"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"Столбец JSONB. Состояние трекера, стекла / заднего листа, электрических соединений и история очистки строки или блока панелей на момент снимка; один JSONB для механической диагностики службой O&amp;M."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="73" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">    </tspan><tspan fill="#90f580">"fields_meaning"</tspan><tspan fill="#e9d46c">: {</tspan></text><text x="10" y="92" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">      </tspan><tspan fill="#90f580">"tracker"</tspan><tspan fill="#e9d46c">: {</tspan></text><text x="10" y="111" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"tracker_state"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Рабочее состояние системы слежения. Возможные значения: Error, Maintenance, Normal."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="130" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"tracker_angle_deg"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"REAL. Угол отклонения системы слежения. Пример: 20.5."</tspan></text><text x="10" y="149" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">      },</tspan></text><text x="10" y="168" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">      </tspan><tspan fill="#90f580">"module_surface"</tspan><tspan fill="#e9d46c">: {</tspan></text><text x="10" y="187" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"backsheet_condition"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Оценка состояния материала заднего листа. Возможные значения: Fair, Good, Poor."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="206" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"glass_condition"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Оценка состояния переднего стекла. Возможные значения: Clear, Damaged, Dusty."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="225" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"encapsulant_yellowing"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Состояние пожелтения герметизирующего материала. NULL означает, что кодировщик не сообщает состояние или данные отсутствуют. Возможные значения: Mild, Severe."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="244" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"delamination_status"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Состояние расслоения. NULL означает, что кодировщик не сообщает состояние или данные отсутствуют. Возможные значения: Major, Minor."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="263" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"busbar_corrosion"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Состояние коррозии токосъёмных шин. NULL означает, что кодировщик не сообщает состояние или данные отсутствуют. Возможные значения: Severe, Visible."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="282" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"hotspot_count"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"BIGINT. Число обнаруженных горячих точек. NULL означает, что кодировщик не сообщает состояние или данные отсутствуют. Пример: 1.0."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="301" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"microcrack_count"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"BIGINT. Число обнаруженных микротрещин. Пример: 7.0."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="320" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"snail_trail_severity"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Выраженность «улиточных следов». NULL означает, что кодировщик не сообщает состояние или данные отсутствуют. Возможные значения: Heavy, Light."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="339" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"pid_severity"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Степень потенциально-индуцированной деградации. NULL означает, что кодировщик не сообщает состояние или данные отсутствуют. Возможные значения: High, Low."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="358" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"lid_status"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Состояние светоиндуцированной деградации. Возможные значения: Ongoing, Stabilized, Unknown."</tspan></text><text x="10" y="377" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">      },</tspan></text><text x="10" y="396" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">      </tspan><tspan fill="#90f580">"electrical_integrity"</tspan><tspan fill="#e9d46c">: {</tspan></text><text x="10" y="415" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"bypass_diode_status"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Работоспособность байпасного диода. Возможные значения: Failed, Normal, Partial."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="434" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"junction_box_condition"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Оценка состояния соединительной коробки. Возможные значения: Fair, Good, Poor."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="453" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"cable_condition"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Оценка состояния кабеля. NULL означает, что кодировщик не сообщает состояние или данные отсутствуют. Возможные значения: Fair, Good, Poor."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="472" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"connector_condition"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Оценка состояния разъёма. Возможные значения: Fair, Good, Poor."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="491" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"grounding_status"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Состояние системы заземления. Возможные значения: Check Required, Failed, Normal."</tspan></text><text x="10" y="510" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">      },</tspan></text><text x="10" y="529" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">      </tspan><tspan fill="#90f580">"mount_cleaning"</tspan><tspan fill="#e9d46c">: {</tspan></text><text x="10" y="548" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"mount_structure_status"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"TEXT. Состояние монтажной конструкции. Возможные значения: Check Required, Stable, Unstable."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="567" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"cleaning_cycle_days"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"BIGINT. Число выполненных циклов очистки. Пример: 38."</tspan><tspan fill="#e9d46c">,</tspan></text><text x="10" y="586" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">        </tspan><tspan fill="#90f580">"last_clean_date"</tspan><tspan fill="#e9d46c">: </tspan><tspan fill="#a8ddff">"DATE. Дата последней очистки. Пример: 45671."</tspan></text><text x="10" y="605" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">      }</tspan></text><text x="10" y="624" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">    }</tspan></text><text x="10" y="643" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">  }</tspan></text><text x="10" y="662" xml:space="preserve" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12"><tspan fill="#e9d46c">}</tspan></text></svg>

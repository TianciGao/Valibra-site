<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2380" viewBox="0 0 1200 2380" role="img" aria-labelledby="title desc">
  <title id="title">Четырёхкомпонентная подготовка, Check, Gate и восстановление</title>
  <desc id="desc">Обычный Check передаёт управление Gate после завершения или при отсутствии следующего инструмента. Дополнительные запросы выполняются до повторного Check. Main получает только проверенное состояние. Переработка ведётся в черновике с откатом при неудаче; независимое восстановление возможно при выполнении условий бюджета.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#60756c"/></marker></defs>
  <style>
    text{font-family:"DejaVu Sans",Arial,sans-serif;font-size:20px;fill:#30453c}
    .title{font-size:28px;font-weight:700;fill:#173e35}
    .heading{font-size:22px;font-weight:700;fill:#173e35}
    .muted{fill:#50665a}
    .card{fill:#fff;stroke:#bfcec5;stroke-width:1.5;rx:12}
    .tinted{fill:#f3f7f4}
    .edge{fill:none;stroke:#60756c;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="2380" fill="#fff"/>
  <text data-label="0" x="40" y="54" class="title"><tspan x="40" dy="0">Общий процесс: проверить и собрать сведения, затем </tspan><tspan x="40" dy="38">написать SQL</tspan></text>
  <g data-node="request"><rect class="card tinted" x="240" y="122" width="720" height="156"/>
  <text data-label="1" x="264" y="159" class="heading"><tspan x="264" dy="0">Исходный запрос / уточнение P2 </tspan><tspan x="264" dy="28">после успешного P1</tspan></text>
  <text data-label="2" x="264" y="233"><tspan x="264" dy="0">Уточнения хранятся отдельно и доступны следующим этапам</tspan></text>
  </g>
  <path class="edge" d="M600 278 V300"/>
  <g data-node="preparation"><rect class="card tinted" x="40" y="300" width="1120" height="260"/>
  <text data-label="3" x="64" y="342" class="heading"><tspan x="64" dy="0">Подготовка: последовательное формирование четырёх компонентов</tspan></text>
  <text data-label="4" x="64" y="405"><tspan x="64" dy="0">Structure: таблицы и </tspan><tspan x="64" dy="28">связи</tspan></text>
  <text data-label="5" x="442" y="405"><tspan x="442" dy="0">Mapping: фразы запроса → </tspan><tspan x="442" dy="28">поля</tspan></text>
  <text data-label="6" x="820" y="405"><tspan x="820" dy="0">Knowledge: </tspan><tspan x="820" dy="28">бизнес-определения</tspan></text>
  <path class="edge" d="M377 411 H415"/>
  <path class="edge" d="M755 411 H793"/>
  <text data-label="7" x="64" y="475" class="muted"><tspan x="64" dy="0">schema / DDL</tspan></text>
  <text data-label="8" x="442" y="475" class="muted"><tspan x="442" dy="0">Описания полей / JSON-пути</tspan></text>
  <text data-label="9" x="820" y="475" class="muted"><tspan x="820" dy="0">Официальные правила и </tspan><tspan x="820" dy="28">формулы</tspan></text>
  <text data-label="10" x="64" y="538"><tspan x="64" dy="0">4 компонента: tables · join_keys · column_mapping · domain_knowledge</tspan></text>
  </g>
  <path class="edge" d="M350 560 V650"/>
  <g data-node="check"><rect class="card tinted" x="100" y="650" width="500" height="168"/>
  <text data-label="11" x="124" y="690" class="heading"><tspan x="124" dy="0">Check: достаточно ли сведений </tspan><tspan x="124" dy="28">для SQL?</tspan></text>
  <text data-label="12" x="124" y="765"><tspan x="124" dy="0">Поля, формулы, фильтры, требования к </tspan><tspan x="124" dy="28">результату</tspan></text>
  </g>
  <g data-node="extra-request"><rect class="card" x="810" y="650" width="350" height="310"/>
  <text data-label="13" x="834" y="690" class="heading"><tspan x="834" dy="0">Один дополнительный </tspan><tspan x="834" dy="28">запрос</tspan></text>
  <text data-label="14" x="834" y="763"><tspan x="834" dy="0">Поле / правило / SQL </tspan><tspan x="834" dy="28">только для чтения</tspan></text>
  <text data-label="15" x="834" y="833"><tspan x="834" dy="0">или уточнение у </tspan><tspan x="834" dy="28">пользователя</tspan></text>
  <text data-label="16" x="834" y="903" class="muted"><tspan x="834" dy="0">Выполнить после </tspan><tspan x="834" dy="28">валидации</tspan></text>
  </g>
  <text data-label="17" x="626" y="688"><tspan x="626" dy="0">Не завершён</tspan></text>
  <text data-label="18" x="626" y="716"><tspan x="626" dy="0">есть инструмент</tspan></text>
  <path class="edge" d="M600 738 H810"/>
  <path class="edge" d="M985 650 V610 H500 V650"/>
  <text data-label="19" x="640" y="594" class="muted"><tspan x="640" dy="0">Новый результат → снова Check</tspan></text>
  <path class="edge" d="M350 818 V950"/>
  <text data-label="20" x="374" y="854"><tspan x="374" dy="0">Завершён / нет следующего </tspan><tspan x="374" dy="28">инструмента</tspan></text>
  <text data-label="21" x="374" y="922"><tspan x="374" dy="0">complete или next_tool = null</tspan></text>
  <g data-node="gate"><rect class="card tinted" x="100" y="950" width="500" height="228"/>
  <text data-label="22" x="124" y="990" class="heading"><tspan x="124" dy="0">Gate: нужны ли изменения по </tspan><tspan x="124" dy="28">новым сведениям?</tspan></text>
  <text data-label="23" x="124" y="1064"><tspan x="124" dy="0">4 компонента, результат и пробелы </tspan><tspan x="124" dy="28">Check, уточнения, сведения</tspan></text>
  <text data-label="24" x="124" y="1132"><tspan x="124" dy="0">Определяет область переработки; не </tspan><tspan x="124" dy="28">подменяет решение Check</tspan></text>
  </g>
  <path class="edge" d="M350 1178 V1214 H215 V1360"/>
  <path class="edge" d="M350 1178 V1214 H600 V1360"/>
  <path class="edge" d="M350 1178 V1214 H985 V1360"/>
  <rect x="40" y="1238" width="350" height="100" fill="#fff"/>
  <text data-label="25" x="56" y="1268"><tspan x="56" dy="0">Без переработки + Check </tspan><tspan x="56" dy="28">завершён</tspan></text>
  <rect x="425" y="1238" width="350" height="100" fill="#fff"/>
  <text data-label="26" x="441" y="1268"><tspan x="441" dy="0">Переработать поля или набор </tspan><tspan x="441" dy="28">таблиц</tspan></text>
  <rect x="810" y="1238" width="350" height="100" fill="#fff"/>
  <text data-label="27" x="826" y="1268"><tspan x="826" dy="0">Завершить / без переработки, </tspan><tspan x="826" dy="28">но Check не завершён</tspan></text>
  <g data-node="main"><rect class="card" x="40" y="1360" width="350" height="364"/>
  <text data-label="28" x="64" y="1400" class="heading"><tspan x="64" dy="0">Обычный Main</tspan></text>
  <text data-label="29" x="64" y="1454"><tspan x="64" dy="0">Запрос + сводка 4 </tspan><tspan x="64" dy="28">компонентов + уточнения</tspan></text>
  <text data-label="30" x="64" y="1526"><tspan x="64" dy="0">execute_sql / submit_sql</tspan></text>
  <text data-label="31" x="64" y="1578"><tspan x="64" dy="0">Написать, выполнить, </tspan><tspan x="64" dy="28">исправить, отправить SQL</tspan></text>
  <text data-label="32" x="64" y="1652"><tspan x="64" dy="0">Задача не решена → </tspan><tspan x="64" dy="28">завершить основной </tspan><tspan x="64" dy="28">процесс</tspan></text>
  </g>
  <g data-node="draft"><rect class="card tinted" x="425" y="1360" width="350" height="364"/>
  <text data-label="33" x="449" y="1400" class="heading"><tspan x="449" dy="0">Временный черновик: </tspan><tspan x="449" dy="28">переработка → Check</tspan></text>
  <text data-label="34" x="449" y="1476"><tspan x="449" dy="0">Поля: Mapping → Knowledge</tspan></text>
  <text data-label="35" x="449" y="1526"><tspan x="449" dy="0">Набор таблиц: сначала </tspan><tspan x="449" dy="28">Structure, затем эти два </tspan><tspan x="449" dy="28">шага</tspan></text>
  <text data-label="36" x="449" y="1620"><tspan x="449" dy="0">В конце — Check черновика</tspan></text>
  <text data-label="37" x="449" y="1674"><tspan x="449" dy="0">До фиксации официальные </tspan><tspan x="449" dy="28">сведения неизменны</tspan></text>
  </g>
  <g data-node="stop"><rect class="card" x="810" y="1360" width="350" height="364"/>
  <text data-label="38" x="834" y="1400" class="heading"><tspan x="834" dy="0">Завершить основной </tspan><tspan x="834" dy="28">процесс</tspan></text>
  <text data-label="39" x="834" y="1476"><tspan x="834" dy="0">Не передавать </tspan><tspan x="834" dy="28">непроверенные</tspan></text>
  <text data-label="40" x="834" y="1532"><tspan x="834" dy="0">результаты обычному Main</tspan></text>
  <text data-label="41" x="834" y="1588"><tspan x="834" dy="0">Валидация инструмента / </tspan><tspan x="834" dy="28">лимит бюджета</tspan></text>
  <text data-label="42" x="834" y="1664"><tspan x="834" dy="0">также могут привести к </tspan><tspan x="834" dy="28">этому выходу раньше</tspan></text>
  </g>
  <path class="edge" d="M215 1724 V1790"/>
  <path class="edge" d="M600 1724 V1790"/>
  <path class="edge" d="M985 1724 V1790"/>
  <g data-node="evaluation"><rect class="card" x="40" y="1790" width="350" height="420"/>
  <text data-label="43" x="64" y="1830" class="heading"><tspan x="64" dy="0">Официальная оценка и </tspan><tspan x="64" dy="28">смена этапов</tspan></text>
  <text data-label="44" x="64" y="1906"><tspan x="64" dy="0">P1 пройден → получить </tspan><tspan x="64" dy="28">запрос P2</tspan></text>
  <text data-label="45" x="64" y="1980"><tspan x="64" dy="0">P2 пройден → задача </tspan><tspan x="64" dy="28">завершена</tspan></text>
  <text data-label="46" x="64" y="2054"><tspan x="64" dy="0">Неудача не означает успех </tspan><tspan x="64" dy="28">восстановления</tspan></text>
  </g>
  <g data-node="draft-exits"><rect class="card" x="425" y="1790" width="350" height="550"/>
  <text data-label="47" x="449" y="1830" class="heading"><tspan x="449" dy="0">Выходы Check </tspan><tspan x="449" dy="28">черновика</tspan></text>
  <text data-label="48" x="449" y="1900"><tspan x="449" dy="0">Пройден: валидация и </tspan><tspan x="449" dy="28">фиксация → обычный Main</tspan></text>
  <text data-label="49" x="449" y="1976"><tspan x="449" dy="0">Не завершён: допустимый </tspan><tspan x="449" dy="28">доп. запрос → снова Check</tspan></text>
  <text data-label="50" x="449" y="2066"><tspan x="449" dy="0">Продолжение невозможно: </tspan><tspan x="449" dy="28">отбросить → завершить </tspan><tspan x="449" dy="28">процесс</tspan></text>
  <text data-label="51" x="449" y="2174"><tspan x="449" dy="0">Нужен вопрос: отбросить, </tspan><tspan x="449" dy="28">спросить, новый черновик </tspan><tspan x="449" dy="28">через Gate</tspan></text>
  </g>
  <g data-node="fallback"><rect class="card tinted" x="810" y="1790" width="350" height="550"/>
  <text data-label="52" x="834" y="1830" class="heading"><tspan x="834" dy="0">Внешняя проверка </tspan><tspan x="834" dy="28">условий </tspan><tspan x="834" dy="28">восстановления</tspan></text>
  <text data-label="53" x="834" y="1930"><tspan x="834" dy="0">Функция включена + </tspan><tspan x="834" dy="28">задача не решена</tspan></text>
  <text data-label="54" x="834" y="2010"><tspan x="834" dy="0">Остаток ≥ 3 Coin + </tspan><tspan x="834" dy="28">восстановления ещё не </tspan><tspan x="834" dy="28">было</tspan></text>
  <text data-label="55" x="834" y="2110"><tspan x="834" dy="0">Да: отдельный исходный </tspan><tspan x="834" dy="28">Agent, все инструменты</tspan></text>
  <text data-label="56" x="834" y="2200"><tspan x="834" dy="0">Нет: вернуть имеющийся </tspan><tspan x="834" dy="28">результат</tspan></text>
  <text data-label="57" x="834" y="2276"><tspan x="834" dy="0">Без сброса бюджета и </tspan><tspan x="834" dy="28">возврата в основной процесс</tspan></text>
  </g>
</svg>
